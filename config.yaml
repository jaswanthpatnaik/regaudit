poll_interval_seconds: 10
db_path: "data/regaudit.db"
baseline_path: "baseline/registry_baseline.json"
log_path: "logs/regaudit.log"
log_max_bytes: 10485760
log_backup_count: 3

alert_on_severity:
  - "CRITICAL"
  - "HIGH"

suspicious_paths:
  - "\\Temp\\"
  - "\\AppData\\Roaming\\"
  - "\\AppData\\Local\\Temp\\"
  - "\\Downloads\\"
  - "\\Public\\"
  - "\\ProgramData\\"

malware_value_patterns:
  - name: "DisableAntiSpyware"
    match: "1"
    severity: "HIGH"
  - name: "DisableRealtimeMonitoring"
    match: "1"
    severity: "HIGH"
  - name: "EnableLUA"
    match: "0"
    severity: "HIGH"
  - name: "ConsentPromptBehaviorAdmin"
    match: "0"
    severity: "HIGH"
  - name: "DisableCMD"
    match: "1"
    severity: "CRITICAL"
  - name: "DisableRegistryTools"
    match: "1"
    severity: "CRITICAL"
  - name: "Shell"
    key_contains: "Winlogon"
    severity: "CRITICAL"
  - name: "Userinit"
    key_contains: "Winlogon"
    severity: "CRITICAL"
